<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر إلكتروني - Orchid Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      text-align: center;
      margin: 0;
    }
    .product-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto 20px auto;
    }
    button.order-btn {
      background-color: #27ae60;
      color: white;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    button.order-btn:hover {
      background-color: #219150;
    }
    #order-form-container {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 20px auto;
      text-align: right;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .price-summary {
      background-color: #eef9f2;
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- بطاقة المنتج -->
  <div class="product-card">
    <h2>متجر Orchid</h2>
    <p>منتجات عالية الجودة بأفضل الأسعار</p>
    <p>السعر: <strong>3500 دج</strong></p>
    <button class="order-btn" onclick="showForm()">اطلب الآن</button>
  </div>

  <!-- استمارة الطلب السريع -->
  <div id="order-form-container">
    <h3>استمارة الطلب السريع</h3>
    <form onsubmit="checkOrder(event)">
      <label for="fullname">الاسم واللقب:</label>
      <input type="text" id="fullname" placeholder="أدخل اسمك الكامل" required>

      <label for="phone">رقم الهاتف (10 أرقام بدون مسافات):</label>
      <input type="tel" id="phone" placeholder="06XXXXXXXX" pattern="[0-9]{10}" maxlength="10" title="يرجى كتابة 10 أرقام فقط" required>

      <label for="state">الولاية:</label>
      <select id="state" required>
        <option value="">اختر الولاية...</option>
        <option value="02 - الشلف">02 - الشلف</option>
        <option value="16 - الجزائر العاصمة">16 - الجزائر العاصمة</option>
        <option value="31 - وهران">31 - وهران</option>
      </select>

      <label for="commune">البلدية:</label>
      <input type="text" id="commune" placeholder="أدخل اسم البلدية" required>

      <label for="delivery_type">نوع التوصيل:</label>
      <select id="delivery_type" onchange="updateTotal()">
        <option value="desk">توصيل إلى المكتب (Stop Desk) - 400 دج</option>
        <option value="home">توصيل إلى المنزل (A domicile) - 700 دج</option>
      </select>

      <div class="price-summary">
        <p>سعر المنتج: <strong>3500 دج</strong></p>
        <p>سعر التوصيل: <span id="shipping-price">400</span> دج</p>
        <h4>المجموع الكلي: <span id="total-price" style="color: #27ae60;">3900</span> دج</h4>
      </div>

      <button type="submit" class="order-btn" style="background-color: #27ae60;">تأكيد الطلب الآن</button>
    </form>
  </div>

      document.getElementById("total-price").innerText = total;
